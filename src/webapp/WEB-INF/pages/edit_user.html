<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
</head>
<body>
<h2>Редактировать пользователя</h2>

<form th:method="POST" th:action="@{/users/update}" th:object="${user}">
    <input type="hidden" th:field="*{id}"/>

    <label for="name">Имя</label>
    <input type="text" th:field="*{name}" id="name" required/>
    <br/><br/>

    <label for="lastName">Фамилия</label>
    <input type="text" th:field="*{lastName}" id="lastName" required/>
    <br/><br/>

    <label for="age">Возраст:</label>
    <input type="number" th:field="*{age}" id="age"
           min="1" max="100" step="1" required/>
    <br/><br/>

    <label for="email">Email:</label>
    <input type="email" th:field="*{email}" id="email" required/>
    <br/><br/>

    <button type="submit">Сохранить изменения</button>
</form>
<br/>
<a th:href="@{/users}">Отмена</a>
</body>
</html>
